name: Main
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  verify-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package
      - run: pnpm run check
